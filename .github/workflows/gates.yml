name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both gates are stdlib-only and self-contained in a fresh clone.
      - name: page matches parts/
        run: python3 scripts/build_page.py --check
      - name: README matches the data
        run: python3 scripts/check_readme.py
