name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both gates are stdlib-only and self-contained in a fresh clone.
      - name: page matches parts/
        run: python3 scripts/build_page.py --check
      - name: README matches the data
        run: python3 scripts/check_readme.py
      # Both gates above read source. Neither loads the artifact, so a
      # rendering-fatal one-liner shipped green until this step existed.
      # Chrome is installed on the GitHub runner image; on a machine without
      # one the script SKIPS loudly rather than passing quietly.
      - name: the built page actually runs
        run: python3 scripts/check_page_runs.py
